<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TOEIC Practice</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 1.5rem; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        a { text-decoration: none; color: #1a5fb4; font-weight: bold; }
        .meta { color: #666; font-size: 0.85rem; margin-top: 4px; }
        .review-link { display: inline-block; margin-bottom: 16px; }
        .badge { background: #e01b24; color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 0.8rem; margin-left: 6px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logout-btn { background: none; border: none; padding: 0; font-family: inherit; font-size: 0.9rem; font-weight: bold; color: #1a5fb4; cursor: pointer; text-decoration: none; }
        .streak { color: #666; font-size: 0.9rem; margin-bottom: 16px; }
        .streak strong { color: #e01b24; }
    </style>
</head>
<body>
    <h1>TOEIC Practice</h1>
    <div class="topbar">
        <a class="review-link" th:href="@{/review}">
            復習する
            <span class="badge" th:if="${reviewCount > 0}" th:text="${reviewCount}">3</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">ログアウト</button>
        </form>
    </div>
    <p class="streak" th:if="${streak > 0}">
        🔥 <strong th:text="${streak}">3</strong> 日連続で学習中！
    </p>
    <ul>
        <li th:each="p : ${passages}">
            <a th:href="@{/passages/{id}(id=${p.id})}" th:text="${p.title}">Title</a>
            <div class="meta" th:text="${p.partType} + ' / ' + ${p.skillType}">PART5 / READING</div>
        </li>
    </ul>
</body>
</html>
