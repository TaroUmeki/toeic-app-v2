<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TOEIC Reading Practice</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 1.5rem; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        a { text-decoration: none; color: #1a5fb4; font-weight: bold; }
        .meta { color: #666; font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>TOEIC Reading Practice</h1>
    <ul>
        <li th:each="p : ${passages}">
            <a th:href="@{/passages/{id}(id=${p.id})}" th:text="${p.title}">Title</a>
            <div class="meta" th:text="${p.partType} + ' / ' + ${p.skillType}">PART5 / READING</div>
        </li>
    </ul>
</body>
</html>
