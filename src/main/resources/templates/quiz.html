<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${passage.title}">Quiz</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
        .body-text { white-space: pre-line; background: #f7f7f7; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .body-text h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin: 0 0 8px; }
        .body-intro { white-space: pre-line; color: #444; margin-bottom: 16px; }
        img.passage-photo { width: 100%; border-radius: 8px; margin-bottom: 16px; }
        audio { width: 100%; margin-bottom: 24px; }
        .question { margin-bottom: 24px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .choice { display: block; margin: 6px 0; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
        a.back { display: inline-block; margin-bottom: 16px; }
    </style>
</head>
<body>
    <a class="back" th:href="@{/passages}">&larr; 一覧に戻る</a>
    <h1 th:text="${passage.title}">Title</h1>
    <div th:each="section : ${passage.bodySections}"
         th:class="${passage.bodySections.size() > 1 and section.label == null} ? 'body-intro' : 'body-text'">
        <h2 th:if="${section.label != null}" th:text="${section.label}">Advertisement</h2>
        <div th:text="${section.text}"></div>
    </div>
    <img class="passage-photo" th:if="${passage.imageUrl != null and !passage.imageUrl.isEmpty()}" th:src="@{${passage.imageUrl}}" alt="Photo" />
    <audio th:if="${passage.audioUrl != null and !passage.audioUrl.isEmpty()}" controls="controls">
        <source th:src="@{${passage.audioUrl}}" type="audio/mpeg" />
    </audio>

    <form th:action="@{/passages/{id}/submit(id=${passage.id})}" method="post">
        <div class="question" th:each="q : ${passage.questions}">
            <p th:text="${q.questionText}">Question text</p>
            <label class="choice" th:each="c : ${q.choices}">
                <input type="radio" th:name="'answer_' + ${q.id}" th:value="${c.id}" required="required" />
                <span th:text="${c.label} + '. ' + ${c.choiceText}">A. choice</span>
            </label>
        </div>
        <button type="submit">採点する</button>
    </form>
</body>
</html>
