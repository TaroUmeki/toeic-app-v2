<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>結果</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
        .score { font-size: 1.2rem; font-weight: bold; margin-bottom: 24px; }
        .question { margin-bottom: 24px; padding: 12px; border-radius: 8px; }
        .question.correct { border: 1px solid #2ec27e; background: #eafaf1; }
        .question.incorrect { border: 1px solid #e01b24; background: #fdecea; }
        .explanation { color: #555; font-size: 0.9rem; margin-top: 8px; }
        .script { white-space: pre-line; background: #f7f7f7; padding: 12px; border-radius: 8px; margin-bottom: 24px; }
        .script h2 { font-size: 1rem; margin: 0 0 8px; }
        a.back { display: inline-block; margin-bottom: 16px; }
    </style>
</head>
<body>
    <a class="back" th:href="@{/passages}">&larr; 一覧に戻る</a>
    <h1 th:text="${passage.title}">Title</h1>
    <div class="score" th:text="'スコア: ' + ${correctCount} + ' / ' + ${total}">Score</div>

    <div class="script" th:if="${passage.audioScript != null and !passage.audioScript.isEmpty()}">
        <h2>スクリプト</h2>
        <div th:text="${passage.audioScript}"></div>
    </div>

    <div class="question" th:each="r : ${results}" th:classappend="${r.correct} ? 'correct' : 'incorrect'">
        <p th:text="${r.question.questionText}">Question</p>
        <p th:text="${r.correct} ? '正解！' : '不正解'"></p>
        <p th:if="${!r.correct}" th:text="'正解: ' + ${r.correctChoice.label} + '. ' + ${r.correctChoice.choiceText}"></p>
        <p class="explanation" th:if="${r.question.explanation != null}" th:text="${r.question.explanation}"></p>
    </div>
</body>
</html>
